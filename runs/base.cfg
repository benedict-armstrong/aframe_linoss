# luigi level config
[luigi_core]
local_scheduler = true
module = aframe
log_level = INFO

# configuration for pipeline parameters

[luigi_base]
ifos = ["H1", "L1"]

# data generation parameters
train_start = 1240579783
train_stop = 1241443783
test_stop = 1244035783
max_duration = 20000
Tb = 31536000.0
flag = DATA
channels =  &::ifos
shifts = [0, 1]
seed = 1122
 
streams_per_gpu = 6

# waveform parameters
waveform_approximant = IMRPhenomPv2
waveform_duration = 25
minimum_frequency = 20
reference_frequency = 20
right_pad = 3

# training parameters
kernel_length = 20
batch_size = 128
prior = priors.priors.end_o3_ratesandpops_bns

# data conditioning / preprocessing parameters

# keep empty to use the default
fftlength = 2
sample_rate = 2048
fduration = 2
highpass = 32
lowpass = 1024

# inference / export parameters  
inference_psd_length = 64
inference_sampling_rate = 16
inference_batch_size = 128

# [luigi_FetchTrain]
# workflow = htcondor
# start = &::luigi_base::train_start
# end = &::luigi_base::train_stop
# sample_rate = &::luigi_base::sample_rate
# min_duration = 1024
# max_duration = &::luigi_base::max_duration
# flag = &::luigi_base::flag
# ifos = &::luigi_base::ifos
# channels = &::luigi_base::channels
# request_memory = 16GB
# request_disk = 200MB
# request_cpus = 1

[luigi_TrainingWaveforms]
workflow = htcondor
num_signals = 100000
seed = 1234
prior = &::luigi_base::prior
start = &::luigi_base::train_stop
end = &::luigi_base::test_stop
ifos = &::luigi_base::ifos
psd_length = &::luigi_base::inference_psd_length
sample_rate = &::luigi_base::sample_rate
minimum_frequency = &::luigi_base::minimum_frequency
reference_frequency = &::luigi_base::reference_frequency
waveform_duration = &::luigi_base::waveform_duration
waveform_approximant = &::luigi_base::waveform_approximant
right_pad = &::luigi_base::right_pad
highpass = &::luigi_base::highpass
lowpass = &::luigi_base::lowpass
request_memory = 16GB
request_disk = 20GB
request_cpus = 1

# [luigi_ValidationWaveforms]
# workflow = htcondor
# num_jobs = 20
# num_signals = 20000
# ifos = &::luigi_base::ifos
# highpass = &::luigi_base::highpass
# lowpass = &::luigi_base::lowpass
# sample_rate = &::luigi_base::sample_rate
# waveform_duration = &::luigi_base::waveform_duration
# minimum_frequency = &::luigi_base::minimum_frequency
# reference_frequency = &::luigi_base::reference_frequency
# waveform_approximant = &::luigi_base::waveform_approximant
# right_pad = &::luigi_base::right_pad
# prior = &::luigi_base::prior
# snr_threshold = 4
# request_memory = 16GB
# request_disk = 200MB
# request_cpus = 1

[luigi_FetchTest]
workflow = local
start = &::luigi_base::train_stop
end = &::luigi_base::test_stop
sample_rate = &::luigi_base::sample_rate
min_duration = 128
max_duration = &::luigi_base::max_duration
flag = &::luigi_base::flag
channels = &::luigi_base::channels
request_memory = 16GB
request_disk = 200MB
request_cpus = 1

[luigi_TestingWaveforms]
workflow = htcondor
num_signals = 50000
shifts = &::luigi_base::shifts
spacing = 16
buffer = 16
snr_threshold = 4
seed = &::luigi_base::seed
prior = &::luigi_base::prior
start = &::luigi_base::train_stop
end = &::luigi_base::test_stop
ifos = &::luigi_base::ifos
psd_length = &::luigi_base::inference_psd_length
sample_rate = &::luigi_base::sample_rate
minimum_frequency = &::luigi_base::minimum_frequency
reference_frequency = &::luigi_base::reference_frequency
waveform_duration = &::luigi_base::waveform_duration
waveform_approximant = &::luigi_base::waveform_approximant
right_pad = &::luigi_base::right_pad
highpass = &::luigi_base::highpass
lowpass = &::luigi_base::lowpass
request_memory = 16GB
request_disk = 20GB
request_cpus = 1

[luigi_ExportLocal]
fduration = &::luigi_base::fduration
kernel_length = &::luigi_base::kernel_length
inference_sampling_rate = &::luigi_base::inference_sampling_rate
sample_rate = &::luigi_base::sample_rate
ifos = &::luigi_base::ifos
batch_size = &::luigi_base::inference_batch_size
psd_length = &::luigi_base::inference_psd_length
highpass = &::luigi_base::highpass
streams_per_gpu = &::luigi_base::streams_per_gpu

[luigi_Infer]
workflow = htcondor
fduration = &::luigi_base::fduration
batch_size = &::luigi_base::inference_batch_size
psd_length = &::luigi_base::inference_psd_length
ifos = &::luigi_base::ifos
inference_sampling_rate = &::luigi_base::inference_sampling_rate
cluster_window_length = 8
integration_window_length = 1
Tb = &::luigi_base::Tb
shifts = &::luigi_base::shifts
streams_per_gpu = &::luigi_base::streams_per_gpu
# inferences per gpu per second
rate_per_gpu = 8
return_timeseries = True

# triton args
model_name = aframe-stream
model_version = -1
# triton_image = /fast/barmstrong/container/aframe/tritonserver_25.06-py3_jax.sif
triton_image = /fast/barmstrong/container/aframe/tritonserver_25.06-py3_jax_2.sif
# triton_image = /fast/barmstrong/container/aframe/tritonserver_25.06-py3_sandbox
sequence_id = 1001

request_memory = 16G
request_disk = 10G
request_cpus = 1

[luigi_SensitiveVolume]
mass_combos =  [[1.4,1.4], [1.5, 1.5], [2.0, 2.0], [2.3, 2.3]]
ifos = &::luigi_base::ifos
source_prior = &::luigi_base::prior
dt = 1

[logging]
law: INFO 
law.sandbox.base: INFO
law.patches: INFO
luigi-interface: INFO
law.workflow.base: INFO
