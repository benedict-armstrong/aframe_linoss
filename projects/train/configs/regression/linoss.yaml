model:
  class_path: train.model.JaxRegressionAframe
  init_args:
    arch:
      class_path: architectures.regresssion.RegressionTimeDomainLinOSS
      init_args:
        time_in_features: 2 # H1, L1
        time_hidden_dim: 32
        time_num_blocks: 3
        time_dropout_rate: 0.1
        time_state_dim: 32
        time_r_min: 0.9
        time_theta_max: 3.14159265359
        time_num_res_blocks: 1
        time_conv_kernel_size: 4
        time_conv_position: pre
        resnet_layers: [2, 2, 2]
        resnet_latent_dim: 64
        resnet_kernel_size: 7
        resnet_norm_groups: 16
        mlp_width: 64
        mlp_depth: 2
        d_output: 2 # chirp_mass mean + log-var
        seed: 0
    d_output: 2
    normalize_input: true
    y_mean: [1.2] # centre of BNS chirp_mass prior [0.87, 2.22]
    y_std: [0.35] # approx std of uniform [0.87, 2.22]
    learning_rate: 1e-4
    weight_decay: 0.01
    warmup_steps: 1000
    max_steps: 3000000
    clip_grad_norm: 10.0
    beta_nll: 0.3
    lambda_spread: 0.3
    seed: 42
    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: /home/barmstrong/aframe_new/data/bns/background_data
    waveforms_dir: /home/barmstrong/aframe_new/data/bns/aframe_train/
    ifos: [H1, L1]
    sample_rate: 2048

    target_sample_rate: 512
    kernel_length: 2.0
    left_pad: 1.75
    right_pad: 0

    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20
    lowpass: 1024
    batch_size: 256
    batches_per_epoch: 1000
    num_files_per_batch: 4
    chunk_size: 10000
    chunks_per_epoch: 10
    waveform_prob: 1.0
    swap_prob: 0
    mute_prob: 0
    max_num_workers: 16
    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        max_min_snr: 8.0
        min_min_snr: 4.0
        max_snr: 100.0
        decay_steps: 10000
        distribution_type: uniform

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: /home/barmstrong/aframe_new/data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: /home/barmstrong/aframe_new/data/bns/aframe_train/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false

trainer:
  accelerator: auto
  strategy: auto
  devices: auto

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 25
  enable_progress_bar: true

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "aframe_linoss_regression"
        save_dir: outputs
        project: "aframe_regression"
  callbacks:
    - class_path: train.callbacks.WaveformWindowDiagram
    - class_path: train.metric.plotting.ValueDistributionCallback
    - class_path: train.metric.plotting.ChirpMassErrorVsSnrCallback
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_last: true
        filename: "bns_linoss_regression_gaussnll_{epoch:02d}"
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/valid_auroc_epoch
        mode: max
        save_top_k: 3
        filename: "bns_linoss_regression_auroc_{epoch:02d}"
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
